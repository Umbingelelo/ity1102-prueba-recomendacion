# Prometheus (el del L8) leyendo las métricas de tu sistema. Cada servicio publica /metrics, que el
# gateway NO deja salir a internet: Prometheus las lee desde adentro de la red de Docker.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: dominio
    metrics_path: /metrics
    static_configs:
      - targets: ["dominio:8000"]

  # La IA tiene dos réplicas: el DNS de Docker devuelve una IP por réplica y Prometheus lee las dos
  - job_name: ia
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["ia"]
        type: A
        port: 8000
        refresh_interval: 10s
