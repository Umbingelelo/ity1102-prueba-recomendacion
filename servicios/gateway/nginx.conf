# API gateway: la única puerta de entrada. Es el único servicio que publica un puerto (8080).
#
#   /            -> front    (la página)
#   /api/ia/...  -> ia       (las DOS réplicas, repartidas por turnos; si una falla, reintenta en la otra)
#   /api/...     -> dominio  (la API pública: /api/predict, /api/health, ...)
#   /docs        -> dominio  (OpenAPI / Swagger)
#
# /interno/... y /metrics NO se publican: solo se llega a ellos desde la red interna de Docker.

worker_processes auto;
events { worker_connections 1024; }

http {
    # El DNS interno de Docker. «resolve» + «valid=5s»: si una réplica se detiene, sale de la lista en
    # menos de 5 s; si se crea una nueva, entra sola. Sin esto, nginx se queda con las IP del arranque.
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format json escape=json '{"servicio":"gateway","ts":"$time_iso8601","metodo":"$request_method",'
                                '"ruta":"$uri","codigo":$status,"ms":$request_time,'
                                '"upstream":"$upstream_addr","upstream_ms":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    upstream front   { zone front 64k;   server front:80 resolve; }
    upstream dominio { zone dominio 64k; server dominio:8000 resolve; }
    upstream ia {
        zone ia 64k;
        # Docker devuelve una IP por réplica: nginx las reparte por turnos (round robin).
        # max_fails=1 fail_timeout=5s: una réplica que falla queda fuera 5 s.
        server ia:8000 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /salud { access_log off; return 200 "ok\n"; }

        location /api/ia/ {
            proxy_pass http://ia/;                    # la barra final quita el prefijo /api/ia
            # Dentro de la red de Docker conectar toma menos de 1 ms. Si en 150 ms no conecta, la réplica
            # está caída: se marca y se pasa a la otra ANTES de que el dominio se canse de esperar.
            proxy_connect_timeout 150ms;
            proxy_read_timeout 15s;
            # Si la réplica elegida no responde, se reintenta en la otra. La predicción no tiene efectos
            # secundarios, por eso se permite reintentar también el POST (non_idempotent).
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            add_header X-Replica-IA $upstream_addr always;
        }

        location /api/ {
            proxy_pass http://dominio;
            proxy_read_timeout 30s;
        }

        location = /docs         { proxy_pass http://dominio; }
        location = /openapi.json { proxy_pass http://dominio; }

        location / {
            proxy_pass http://front;
        }
    }
}
